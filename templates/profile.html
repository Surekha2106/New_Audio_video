{% extends "base.html" %}

{% block title %}Smart AI | Profile{% endblock %}

{% block content %}
<div class="glass-card animate-fade-in-up" style="max-width: 800px; margin: 0 auto; padding: 3rem;">
    <div style="display: flex; align-items: center; gap: 2rem; margin-bottom: 3rem;">
        <div style="width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); display: flex; justify-content: center; align-items: center; color: white; font-size: 3rem; font-weight: bold; box-shadow: 0 10px 25px -5px var(--primary-glow);">
            {{ user[0]|upper if user else 'U' }}
        </div>
        <div>
            <h1 style="margin: 0; font-size: 2.5rem;">{{ user }}</h1>
            <p style="color: var(--text-muted); font-size: 1.1rem; margin-top: 0.5rem;">Pro Member</p>
        </div>
    </div>
    
    <form style="display: flex; flex-direction: column; gap: 1.5rem;">
        <div>
            <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-weight: 500;">Username</label>
            <input type="text" value="{{ user }}" disabled style="width: 100%; padding: 1rem; border-radius: 1rem; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); color: var(--text-main); font-family: inherit; font-size: 1rem;">
        </div>
        <div>
            <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-weight: 500;">Email Address</label>
            <input type="email" placeholder="email@example.com" style="width: 100%; padding: 1rem; border-radius: 1rem; border: 1px solid var(--glass-border); background: var(--glass-bg); color: var(--text-main); font-family: inherit; font-size: 1rem; outline: none; transition: var(--transition-smooth);">
        </div>
        <div>
            <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-weight: 500;">Update Password</label>
            <input type="password" placeholder="Enter new password" style="width: 100%; padding: 1rem; border-radius: 1rem; border: 1px solid var(--glass-border); background: var(--glass-bg); color: var(--text-main); font-family: inherit; font-size: 1rem; outline: none; transition: var(--transition-smooth);">
        </div>
        
        <button type="button" class="btn-primary" style="align-self: flex-start; margin-top: 1rem;">
            Save Changes
        </button>
    </form>
</div>
{% endblock %}
